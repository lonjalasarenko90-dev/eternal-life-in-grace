<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>Вічне життя в благодаті · Eternal Life in Grace</title>
<meta name="description" content="Незалежний двомовний духовно-освітній портал: Біблія, благодать, вічне життя. Independent bilingual study portal.">
<style>
:root{--sky:#3f9bd8;--sky-d:#2a79b3;--sky-l:#e6f4fd;--gold:#d7a019;--gold-d:#a87a08;--gold-l:#fff5d1;--green:#6fb85e;--green-d:#3f8a36;--green-l:#e9f7e3;--yel:#fffbe6;--ink:#213b52;--dim:#5d7387;--line:#d9e7f1;--bg:#fbfdff;--card:#fff;--fs:17px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:100vw}
#top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;background:linear-gradient(180deg,#fff,#f3faff);border-bottom:1px solid var(--line)}
#top .brand{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
#top .brand b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
#top .brand small{display:block;font-size:10.5px;color:var(--gold-d);letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand span.t{min-width:0;overflow:hidden}
.sunico{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7c2,#f6c63a 60%,#e9a80f);box-shadow:0 0 0 4px rgba(246,198,58,.22)}
.iconbtn{flex:0 0 auto;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink);cursor:pointer}
.lang{flex:0 0 auto;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;font:inherit;font-weight:700;font-size:13px;padding:0 10px;height:42px;min-width:46px;color:var(--dim);cursor:pointer}
.lang button.on{background:var(--sky);color:#fff}
#scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#f4fbff 0,#fbfdff 240px)}
#view{max-width:780px;margin:0 auto;padding:14px 14px 28px;font-size:var(--fs)}
#bnav{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#bnav button{flex:1 1 0;min-width:0;border:0;background:none;font:inherit;font-size:11px;color:var(--dim);padding:7px 2px 8px;min-height:56px;cursor:pointer}
#bnav button i{display:block;font-style:normal;font-size:21px;line-height:1.2}
#bnav button.on{color:var(--sky-d);font-weight:700}
#bnav button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.45em}h2{font-size:1.2em;color:var(--sky-d)}h3{font-size:1.02em}
p{margin:0 0 .8em}
a{color:var(--sky-d)}
.hero{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 8px 26px rgba(63,155,216,.18);margin-bottom:14px;background:#cfeaff}
.hero svg{display:block;width:100%;height:auto}
.hero .txt{position:absolute;left:0;right:0;top:0;padding:16px 16px 0;text-align:center}
.hero h1{margin:0;font-size:clamp(20px,6.2vw,34px);color:#1d4e77;letter-spacing:.03em;text-shadow:0 1px 0 #fff,0 0 18px rgba(255,255,255,.9)}
.hero .en{font-size:clamp(11px,3.2vw,15px);letter-spacing:.3em;color:var(--gold-d);font-weight:700;margin-top:4px;text-shadow:0 0 10px #fff}
.hero .sub{font-size:clamp(12px,3.5vw,16px);color:#2b5a80;margin-top:8px;text-shadow:0 0 10px #fff,0 0 4px #fff}
.rays{transform-origin:310px 70px;animation:spin 60s linear infinite}
.cl1{animation:drift 38s ease-in-out infinite alternate}.cl2{animation:drift 52s ease-in-out infinite alternate-reverse}
.shim{stroke-dasharray:6 14;animation:flow 5s linear infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(22px)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view>*{animation:fade .35s ease both}
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px;padding:12px 8px;border-radius:18px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:700;color:var(--ink);text-align:center;cursor:pointer;box-shadow:0 3px 10px rgba(33,59,82,.06);transition:transform .15s,box-shadow .15s}
.big:active{transform:scale(.97)}
.big i{font-style:normal;font-size:28px;line-height:1}
.big.c1{background:linear-gradient(160deg,#fff,var(--sky-l))}.big.c2{background:linear-gradient(160deg,#fff,var(--gold-l))}.big.c3{background:linear-gradient(160deg,#fff,var(--green-l))}
.card{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:0 0 10px;box-shadow:0 2px 8px rgba(33,59,82,.05)}
button.card{cursor:pointer}
button.card:active{background:var(--sky-l)}
.card .row{display:flex;gap:12px;align-items:flex-start}
.card .ic{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:var(--sky-l);display:flex;align-items:center;justify-content:center;font-size:22px}
.card .bd{flex:1 1 auto;min-width:0}
.card h3{margin:0 0 3px;overflow-wrap:anywhere}
.card .meta{font-size:.8em;color:var(--dim);overflow-wrap:anywhere}
.card p{margin:.35em 0 0;font-size:.93em}
.cover{flex:0 0 56px;width:56px;height:78px;border-radius:8px 10px 10px 8px;background:linear-gradient(135deg,var(--sky),#8fd0f5);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:inset 5px 0 0 rgba(255,255,255,.35),0 3px 8px rgba(33,59,82,.18)}
.cover.g{background:linear-gradient(135deg,#f1c74a,#ffe9a3)}.cover.n{background:linear-gradient(135deg,#7cc56c,#c9efbd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -14px 4px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:.86em;color:var(--ink);min-height:42px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;border:1px solid var(--sky);background:var(--sky);color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;margin:0 8px 8px 0}
.btn.ghost{background:#fff;color:var(--sky-d);border-color:var(--line)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2b00}
.btn.sm{min-height:44px;min-width:44px;padding:6px 12px;font-size:.86em}
.btn[disabled]{opacity:.5}
.verse{margin:0 0 12px;padding:14px 16px;border-radius:16px;background:linear-gradient(160deg,var(--yel),#fff);border:1px solid #f1e2a6;border-left:5px solid var(--gold)}
.verse p{font-family:Georgia,"Times New Roman",serif;font-size:1.08em;line-height:1.6;margin:0 0 8px}
.verse footer{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8em;color:var(--dim)}
.verse footer b{color:var(--gold-d);font-size:1.05em}
.tag{display:inline-block;font-size:.72em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--sky-l);color:var(--sky-d);margin:0 6px 6px 0}
.tag.q{background:#fde9ef;color:#a3345a}.tag.r{background:var(--sky-l);color:var(--sky-d)}.tag.t{background:var(--green-l);color:var(--green-d)}.tag.a{background:var(--gold-l);color:var(--gold-d)}.tag.w{background:#f0f0f0;color:#666}.tag.b{background:var(--yel);color:var(--gold-d)}
.note{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;background:#fff}
.note p{margin:0 0 6px}
.srcbtn{border:0;background:none;padding:6px 0;font:inherit;font-size:.82em;color:var(--sky-d);text-decoration:underline;text-align:left;cursor:pointer;min-height:36px}
.pend{border:1px dashed #c9c9c9;border-radius:14px;padding:12px 14px;margin:0 0 10px;color:var(--dim);background:#fafafa;font-size:.92em}
.sec{margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec h2{margin:0}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.lead{color:var(--dim);margin-bottom:14px}
.flip{display:block;width:100%;min-height:92px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#fff,var(--sky-l));padding:14px;margin:0 0 10px;font:inherit;color:var(--ink);text-align:center;cursor:pointer}
.flip small{display:block;color:var(--dim);font-size:.74em;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.flip.on{background:linear-gradient(160deg,#fff,var(--green-l));font-weight:700}
.qz{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px;background:#fff}
.qz h3{margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin:0 0 7px;font:inherit;color:var(--ink);min-height:46px;cursor:pointer}
.opt.sel{border-color:var(--sky);background:var(--sky-l);font-weight:700}
.opt.ok{border-color:var(--green);background:var(--green-l);font-weight:700}
.opt.no{border-color:#e7a2a2;background:#fdf0f0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.cmp>div{border-radius:14px;padding:12px;border:1px solid var(--line);background:#fff;min-width:0}
.cmp>div.b{background:linear-gradient(160deg,#fff,var(--green-l));border-color:#cfe8c6}
.cmp h3{font-size:.95em}
.cmp ul{margin:0;padding-left:1.1em;font-size:.9em}
.cmp li{margin-bottom:5px;overflow-wrap:anywhere}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:999px;transition:width .4s}
input[type=text],input[type=search],input[type=date],input[type=url],select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;margin:0 0 10px}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:.84em;font-weight:700;color:var(--dim);margin:0 0 4px}
.reader{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px}
.reader.paper{background:#fffaf0;border-color:#f0e3c4}
.reader p{font-family:Georgia,"Times New Roman",serif;line-height:1.75;margin:0 0 1em}
.reader p.ask{font-family:inherit;background:var(--green-l);border-radius:12px;padding:10px 12px;font-size:.94em}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tools .btn{margin:0}
.star{border:0;background:none;font-size:22px;line-height:1;min-width:44px;min-height:44px;color:#b9c6d1;cursor:pointer}
.star.on{color:var(--gold)}
.headrow{display:flex;align-items:flex-start;gap:6px}.headrow h1{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.foot{font-size:.78em;color:var(--dim);border-top:1px solid var(--line);margin-top:22px;padding-top:12px;text-align:center}
.empty{text-align:center;color:var(--dim);padding:22px 10px;border:1px dashed var(--line);border-radius:16px;background:#fff;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#213b52;color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center;z-index:9}
#toast.on{opacity:.95}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:380px){.two{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}}
ul.pts{margin:.3em 0 .6em;padding-left:1.2em}ul.pts li{margin-bottom:.3em}
.playing{box-shadow:0 0 0 3px rgba(111,184,94,.35)}
</style>

<script>
/* ===== DATA 1: verses, sources, eternal life, Father, grace & law ===== */
var DB = {};

/* Bible verses. uk = working translation (not an official edition); en = World English Bible (public domain) */
DB.verses = {
jn1_17:{ref:["Івана 1:17","John 1:17"],t:["Бо Закон був даний через Мойсея, а благодать і правда прийшли через Ісуса Христа.","For the law was given through Moses. Grace and truth were realized through Jesus Christ."]},
jn1_18:{ref:["Івана 1:18","John 1:18"],t:["Бога ніхто ніколи не бачив. Єдинородний Син, що в лоні Отця, — Він Його явив.","No one has seen God at any time. The one and only Son, who is in the bosom of the Father, has declared him."]},
jn3_16:{ref:["Івана 3:16","John 3:16"],t:["Бо так полюбив Бог світ, що дав Свого єдинородного Сина, щоб кожен, хто вірить у Нього, не загинув, але мав вічне життя.","For God so loved the world, that he gave his only born Son, that whoever believes in him should not perish, but have eternal life."]},
jn3_17:{ref:["Івана 3:17","John 3:17"],t:["Бо Бог не послав Свого Сина у світ, щоб судити світ, але щоб світ через Нього був спасенний.","For God didn’t send his Son into the world to judge the world, but that the world should be saved through him."]},
jn5_24:{ref:["Івана 5:24","John 5:24"],t:["Істинно кажу вам: хто слухає Моє слово і вірить Тому, Хто послав Мене, має вічне життя і на суд не приходить, але перейшов від смерті до життя.","Most certainly I tell you, he who hears my word and believes him who sent me has eternal life, and doesn’t come into judgment, but has passed out of death into life."]},
jn6_47:{ref:["Івана 6:47","John 6:47"],t:["Істинно кажу вам: хто вірить у Мене, має вічне життя.","Most certainly, I tell you, he who believes in me has eternal life."]},
jn10_10:{ref:["Івана 10:10","John 10:10"],t:["Злодій приходить лише для того, щоб красти, вбивати й нищити. Я прийшов, щоб мали життя, і мали його вдосталь.","The thief only comes to steal, kill, and destroy. I came that they may have life, and may have it abundantly."]},
jn11_25:{ref:["Івана 11:25–26","John 11:25–26"],t:["Ісус сказав їй: «Я є воскресіння і життя. Хто вірить у Мене, хоч і помре, буде жити. І кожен, хто живе і вірить у Мене, не помре повік. Чи віриш ти в це?»","Jesus said to her, “I am the resurrection and the life. He who believes in me will still live, even if he dies. Whoever lives and believes in me will never die. Do you believe this?”"]},
jn13_34:{ref:["Івана 13:34","John 13:34"],t:["Нову заповідь даю вам: любіть один одного. Як Я полюбив вас, так і ви любіть один одного.","A new commandment I give to you, that you love one another. Just as I have loved you, you also love one another."]},
jn14_9:{ref:["Івана 14:9","John 14:9"],t:["Хто бачив Мене, той бачив Отця.","He who has seen me has seen the Father."]},
jn17_3:{ref:["Івана 17:3","John 17:3"],t:["А вічне життя — це щоб пізнали Тебе, єдиного істинного Бога, і Того, Кого Ти послав, — Ісуса Христа.","This is eternal life, that they should know you, the only true God, and him whom you sent, Jesus Christ."]},
lk15_24:{ref:["Луки 15:24","Luke 15:24"],t:["Бо цей мій син був мертвий — і ожив, пропав — і знайшовся.","For this, my son, was dead and is alive again. He was lost and is found."]},
rom5_1:{ref:["Римлян 5:1","Romans 5:1"],t:["Отже, виправдані вірою, ми маємо мир із Богом через нашого Господа Ісуса Христа.","Being therefore justified by faith, we have peace with God through our Lord Jesus Christ."]},
rom5_8:{ref:["Римлян 5:8","Romans 5:8"],t:["А Бог доводить Свою любов до нас тим, що Христос помер за нас, коли ми були ще грішниками.","But God commends his own love toward us, in that while we were yet sinners, Christ died for us."]},
rom6_14:{ref:["Римлян 6:14","Romans 6:14"],t:["Бо гріх не буде панувати над вами: ви ж не під Законом, а під благодаттю.","For sin will not have dominion over you, for you are not under law, but under grace."]},
rom6_23:{ref:["Римлян 6:23","Romans 6:23"],t:["Бо плата за гріх — смерть, а дар Божий — вічне життя в Христі Ісусі, нашому Господі.","For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord."]},
rom8_1:{ref:["Римлян 8:1–2","Romans 8:1–2"],t:["Отже, тепер немає жодного осуду тим, хто в Христі Ісусі, хто живе не за тілом, а за Духом. Бо закон Духа життя в Христі Ісусі визволив мене від закону гріха і смерті.","There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit. For the law of the Spirit of life in Christ Jesus made me free from the law of sin and of death."]},
rom8_11:{ref:["Римлян 8:11","Romans 8:11"],t:["А якщо Дух Того, Хто воскресив Ісуса з мертвих, живе у вас, то Той, Хто воскресив Христа Ісуса з мертвих, оживить і ваші смертні тіла Своїм Духом, що живе у вас.","But if the Spirit of him who raised up Jesus from the dead dwells in you, he who raised up Christ Jesus from the dead will also give life to your mortal bodies through his Spirit who dwells in you."]},
rom8_15:{ref:["Римлян 8:15","Romans 8:15"],t:["Бо ви не отримали духа рабства, щоб знову боятися, але отримали Духа синівства, Яким кличемо: «Авва, Отче!»","For you didn’t receive the spirit of bondage again to fear, but you received the Spirit of adoption, by whom we cry, “Abba! Father!”"]},
rom12_2:{ref:["Римлян 12:2","Romans 12:2"],t:["Не пристосовуйтеся до цього світу, але змінюйтеся оновленням вашого розуму, щоб ви пізнавали, що є воля Божа — добра, приємна і досконала.","Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God."]},
co15_20:{ref:["1 Коринтян 15:20–22","1 Corinthians 15:20–22"],t:["Та нині Христос воскрес із мертвих — первісток серед тих, хто заснув. Бо як через людину прийшла смерть, так через людину — і воскресіння мертвих. Як в Адамі всі вмирають, так у Христі всі оживуть.","But now Christ has been raised from the dead. He became the first fruit of those who are asleep. For since death came by man, the resurrection of the dead also came by man. For as in Adam all die, so also in Christ all will be made alive."]},
co15_26:{ref:["1 Коринтян 15:26","1 Corinthians 15:26"],t:["Останній ворог, якого буде знищено, — смерть.","The last enemy that will be abolished is death."]},
cor2_3_6:{ref:["2 Коринтян 3:6","2 Corinthians 3:6"],t:["Він зробив нас здатними бути служителями Нового Завіту — не букви, а Духа; бо буква вбиває, а Дух оживляє.","…who also made us sufficient as servants of a new covenant, not of the letter, but of the Spirit. For the letter kills, but the Spirit gives life."]},
cor2_5_17:{ref:["2 Коринтян 5:17","2 Corinthians 5:17"],t:["Тож коли хто в Христі, той нове творіння. Старе минуло — ось, усе стало новим.","Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new."]},
gal2_20:{ref:["Галатів 2:20","Galatians 2:20"],t:["Я розп’ятий із Христом, і живу вже не я, а Христос живе в мені. А те життя, яким живу тепер у тілі, я живу вірою в Сина Божого, Який полюбив мене і віддав Себе за мене.","I have been crucified with Christ, and it is no longer I who live, but Christ lives in me. That life which I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself up for me."]},
gal2_21:{ref:["Галатів 2:21","Galatians 2:21"],t:["Я не відкидаю Божої благодаті. Бо якщо праведність — через Закон, то Христос помер даремно.","I don’t reject the grace of God. For if righteousness is through the law, then Christ died for nothing!"]},
gal4_6:{ref:["Галатів 4:6–7","Galatians 4:6–7"],t:["А що ви діти, то Бог послав у ваші серця Духа Свого Сина, Який кличе: «Авва, Отче!» Тож ти вже не раб, а син; а якщо син, то й спадкоємець Божий через Христа.","And because you are children, God sent out the Spirit of his Son into your hearts, crying, “Abba, Father!” So you are no longer a bondservant, but a son; and if a son, then an heir of God through Christ."]},
gal5_1:{ref:["Галатів 5:1","Galatians 5:1"],t:["Тож стійте у свободі, якою Христос нас визволив, і не піддавайтеся знову ярму рабства.","Stand firm therefore in the liberty by which Christ has made us free, and don’t be entangled again with a yoke of bondage."]},
eph2_8:{ref:["Ефесян 2:8–10","Ephesians 2:8–10"],t:["Бо благодаттю ви спасенні через віру, і це не від вас — це Божий дар, не від діл, щоб ніхто не хвалився. Бо ми — Його творіння, створені в Христі Ісусі для добрих діл, які Бог наперед приготував, щоб ми в них жили.","…for by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast. For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them."]},
eph2_18:{ref:["Ефесян 2:18","Ephesians 2:18"],t:["Бо через Нього ми всі маємо доступ до Отця в одному Дусі.","For through him we both have our access in one Spirit to the Father."]},
php4_8:{ref:["Филип’ян 4:8","Philippians 4:8"],t:["Нарешті, брати: що правдиве, що гідне, що справедливе, що чисте, що любе, що славне, — коли є якась чеснота і якась похвала, — про це думайте.","Finally, brothers, whatever things are true, whatever things are honorable, whatever things are just, whatever things are pure, whatever things are lovely, whatever things are of good report: if there is any virtue and if there is any praise, think about these things."]},
heb4_16:{ref:["Євреїв 4:16","Hebrews 4:16"],t:["Тож приступаймо сміливо до престолу благодаті, щоб отримати милість і знайти благодать для своєчасної допомоги.","Let’s therefore draw near with boldness to the throne of grace, that we may receive mercy and may find grace for help in time of need."]},
heb8_13:{ref:["Євреїв 8:13","Hebrews 8:13"],t:["Кажучи «новий», Він визнав перший застарілим. А те, що застаріває і старіє, близьке до зникнення.","In that he says, “A new covenant”, he has made the first obsolete. But that which is becoming obsolete and grows aged is near to vanishing away."]},
heb11_1:{ref:["Євреїв 11:1","Hebrews 11:1"],t:["Віра — це впевненість у сподіваному, доказ невидимого.","Now faith is assurance of things hoped for, proof of things not seen."]},
j1_1_5:{ref:["1 Івана 1:5","1 John 1:5"],t:["Ось звістка, яку ми почули від Нього і звіщаємо вам: Бог є світло, і в Ньому немає жодної темряви.","This is the message which we have heard from him and announce to you, that God is light, and in him is no darkness at all."]},
j1_3_1:{ref:["1 Івана 3:1","1 John 3:1"],t:["Дивіться, яку любов дав нам Отець, щоб ми звалися дітьми Божими!","See how great a love the Father has given to us, that we should be called children of God!"]},
j1_4_8:{ref:["1 Івана 4:8","1 John 4:8"],t:["Хто не любить, той не пізнав Бога, бо Бог є любов.","He who doesn’t love doesn’t know God, for God is love."]},
j1_4_16:{ref:["1 Івана 4:16","1 John 4:16"],t:["Бог є любов, і хто перебуває в любові, той перебуває в Бозі, і Бог перебуває в ньому.","God is love, and he who remains in love remains in God, and God remains in him."]},
j1_4_18:{ref:["1 Івана 4:18","1 John 4:18"],t:["У любові немає страху, але досконала любов проганяє страх, бо страх має муку. Хто боїться, той не досконалий у любові.","There is no fear in love; but perfect love casts out fear, because fear has punishment. He who fears is not made perfect in love."]}
};

  {k:"r",src:"s_why",x:["У проповіді про «чому це можливо» цей вірш названо місцем, де ми «застрягли»: легше шукати причини, чому це неможливо, ніж прийняти слова Ісуса як вони є.","In the “why it’s possible” sermon this verse is called the place where we “got stuck”: it is easier to look for reasons why it is impossible than to take Jesus’ words as they stand."]}],

{id:"s_22",title:"",tt:["Проповідь після 22 днів під вартою","Sermon after 22 days in custody"],date:"",dur:"",lang:"ru",cats:["repent","grace"],

{id:"s_why",title:"",tt:["Проповідь про те, чому це можливо","Sermon on why it is possible"],date:"",dur:"",lang:"ru",cats:["faith","eternal"],

{id:"s_self",title:"",tt:["Недільна проповідь «Будь собою» (назва книги-переказу)","Sunday sermon “Be Yourself” (title of the retelling)"],date:"",dur:"",lang:"ru",cats:["newman","love"],

{id:"s_die",title:"",tt:["Недільна проповідь «Хто навчив людей помирати?» (назва книги-переказу)","Sunday sermon “Who Taught People to Die?” (title of the retelling)"],date:"",dur:"",lang:"ru",cats:["eternal","father"],

{id:"s_think",title:"",tt:["Проповідь про мислення і дві «матриці»","Sermon on thinking and the two “matrices”"],date:"",dur:"",lang:"ru",cats:["grace","law","faith"],

 pts:[["Саме життя важливіше за ситуації в житті.","Life itself matters more than the situations in life."],["Филип’ян 4:8 — програма мислення.","Philippians 4:8 is a programme for thinking."],["Негатив не придушують, а замінюють: факт + «але» + віра.","Negativity is not suppressed but replaced: fact + “but” + faith."]]},
{id:"s_life",title:"",tt:["Проповідь про життя і питання до Марти","Sermon on life and the question to Martha"],date:"",dur:"",lang:"ru",cats:["eternal","jesus"],

{id:"s_found",title:"",tt:["Проповідь «фундамент — Ісус»","Sermon “the foundation is Jesus”"],date:"",dur:"",lang:"ru",cats:["eternal","law","jesus"],

 {q:["Хвороба дитини: «Бог не хоче» чи «мало віри»?","A child’s illness: “God doesn’t want to” or “too little faith”?"],a:["Обидві відповіді Віктор називає хибними й гнітючими. Бог — за здоров’я; допомога може прийти різними шляхами, і через лікарів теж.","Viktor calls both answers wrong and crushing. God is for health; help can come in different ways, including through doctors."]},

{id:"q_zh",date:"",title:["Ефір з архієпископом Сергієм Журавльовим","Broadcast with Archbishop Sergei Zhuravlev"],url:"",

{id:"q_sept",date:"",title:["Ефір із 13 відповідями (вересень 2026)","Broadcast with 13 answers (September 2026)"],url:"",

 {q:["Віра чи самовпевненість?","Faith or self-confidence?"],a:["Вірити в Бога — означає вірити, що Він створив тебе здатним.","To believe in God means to believe that he made you capable."],ref:["Марка 11:22–24","Mark 11:22–24"]},
 {q:["Тоді навіщо християнство?","Then why Christianity?"],a:["Важлива не назва, а результат: щоб людина звільнилася від страху й почала жити.","What matters is not the label but the result: that a person be freed from fear and begin to live."]},

 ]},

 desc:["П’ять коротких розділів, які ведуть через головні тексти сайту. Читається за десять хвилин.","Five short chapters that walk through the main texts of this site. A ten-minute read."],copy:true,
 ch:[
 {t:["З чого все починається","Where it all begins"],h:["<p>Ця книжечка — не проповідь і не підручник. Це запрошення повільно прочитати кілька віршів і запитати себе: що тут сказано насправді?</p><p>Перший вірш знають майже всі: «Так полюбив Бог світ…» (Івана 3:16). Зверніть увагу, з чого він починається. Не з людини, не з її провини й не з вимоги. Він починається з любові Бога.</p><p>Наступний вірш додає: Бог послав Сина не судити світ, а спасати. Якщо читати Біблію, тримаючи в серці ці два вірші, багато чого звучить інакше.</p><p class='ask'>Запитання: з чого зазвичай починається моя думка про Бога — з Його любові чи з моєї провини?</p>","<p>This little book is not a sermon and not a textbook. It is an invitation to read a few verses slowly and ask: what is actually said here?</p><p>Nearly everyone knows the first verse: “For God so loved the world…” (John 3:16). Notice where it begins. Not with us, not with our guilt, not with a demand. It begins with God’s love.</p><p>The next verse adds that God sent the Son not to judge the world but to save it. Read the Bible with these two verses in your heart and much of it sounds different.</p><p class='ask'>Question: where does my thinking about God usually begin — with his love or with my guilt?</p>"]},
 {t:["«Має», а не «матиме»","“Has”, not “will have”"],h:["<p>В Євангелії від Івана Ісус кілька разів говорить про вічне життя в теперішньому часі. «Хто вірить у Мене, має вічне життя» (6:47). «Має… і перейшов від смерті до життя» (5:24).</p><p>Ми звикли думати про вічне життя як про щось, що починається «потім». Але граматика цих віршів проста: має. Уже.</p><p>Пастор Віктор Томєв у своїх проповідях часто зупиняється саме на цьому слові. Докладніше — у розділі «Вічне життя вже зараз», де кожна його думка має позначку джерела.</p><p class='ask'>Запитання: що змінилося б у моєму сьогоднішньому дні, якби вічне життя вже почалося?</p>","<p>In John’s Gospel Jesus speaks of eternal life in the present tense several times. “He who believes in me has eternal life” (6:47). “Has… and has passed out of death into life” (5:24).</p><p>We are used to thinking of eternal life as something that begins “later”. But the grammar of these verses is simple: has. Already.</p><p>Pastor Viktor Tomev often pauses on exactly this word in his sermons. See the section “Eternal Life Now”, where each of his thoughts carries a source label.</p><p class='ask'>Question: what would change in my day today if eternal life has already begun?</p>"]},
 {t:["Вічне життя — це пізнавати","Eternal life is to know"],h:["<p>Ісус Сам дав визначення: «Вічне життя — це щоб пізнали Тебе, єдиного істинного Бога, і Того, Кого Ти послав, — Ісуса Христа» (Івана 17:3).</p><p>Тут немає слова «місце» і немає слова «колись». Є слово «пізнали». Вічне життя — це стосунки.</p><p>А як пізнати Бога, Якого «ніхто ніколи не бачив»? Іван відповідає одразу: Його явив Син (1:18). Ісус каже Пилипові: «Хто бачив Мене, той бачив Отця» (14:9).</p><p class='ask'>Запитання: що я дізнаюся про Отця, коли дивлюся, як Ісус поводиться з людьми?</p>","<p>Jesus himself gave the definition: “This is eternal life, that they should know you, the only true God, and him whom you sent, Jesus Christ” (John 17:3).</p><p>There is no word “place” here and no word “someday”. There is the word “know”. Eternal life is a relationship.</p><p>And how do we know a God whom “no one has seen at any time”? John answers at once: the Son has declared him (1:18). Jesus tells Philip: “He who has seen me has seen the Father” (14:9).</p><p class='ask'>Question: what do I learn about the Father when I watch how Jesus treats people?</p>"]},
 {t:["Дар, а не плата","A gift, not wages"],h:["<p>Павло ставить поруч два слова: «плата» і «дар» (Римлян 6:23). Плату заробляють. Дар отримують.</p><p>В Ефесян 2:8–9 він повторює це тричі іншими словами: не від вас, не від діл, щоб ніхто не хвалився. І одразу додає: ми — Його творіння, створені для добрих діл. Добрі діла не зникають; вони просто стають плодом, а не ціною.</p><p>Тому Римлян 8 починається словами: «Тепер немає жодного осуду».</p><p class='ask'>Запитання: що я досі намагаюся заробити з того, що вже подаровано?</p>","<p>Paul sets two words side by side: “wages” and “gift” (Romans 6:23). Wages are earned. A gift is received.</p><p>In Ephesians 2:8–9 he says it three more times in other words: not of yourselves, not of works, that no one would boast. And he adds at once: we are his workmanship, created for good works. Good works do not vanish; they simply become fruit rather than price.</p><p>That is why Romans 8 opens with: “There is therefore now no condemnation.”</p><p class='ask'>Question: what am I still trying to earn that has already been given?</p>"]},
 {t:["«Чи віриш ти в це?»","“Do you believe this?”"],h:["<p>Біля гробу Лазаря Ісус каже Марті: «Я є воскресіння і життя» (Івана 11:25–26). Не «Я дам», а «Я є».</p><p>І завершує не наказом, а питанням: «Чи віриш ти в це?» Це питання не для іспиту. Воно відчиняє двері.</p><p>Цей сайт не дає готових відповідей замість вас. Він пропонує тексти, джерела й питання. Читайте, порівнюйте, думайте — і нехай слова Ісуса звучать для вас так само світло, як того ранку у Витанії.</p><p class='ask'>Запитання: якою була б моя чесна відповідь Ісусові сьогодні?</p>","<p>At Lazarus’ tomb Jesus says to Martha: “I am the resurrection and the life” (John 11:25–26). Not “I will give” but “I am”.</p><p>And he ends not with a command but with a question: “Do you believe this?” It is not an exam question. It opens a door.</p><p>This site does not give ready answers in your place. It offers texts, sources and questions. Read, compare, think — and may Jesus’ words sound as bright to you as they did that morning in Bethany.</p><p class='ask'>Question: what would my honest answer to Jesus be today?</p>"]}
 ]},

function lines(s){var a=String(s||"").split(/\r?\n/),o=[],i;for(i=0;i<a.length;i++){if(a[i].replace(/\s+/g,""))o.push(a[i].replace(/^\s+|\s+$/g,""));}return o;}
function parseCh(txt){
  var a=String(txt||"").split(/\r?\n/),out=[],cur=null,i,ln;
  for(i=0;i<a.length;i++){ln=a[i];
    if(/^##\s+/.test(ln)){cur={t:ln.replace(/^##\s+/,""),b:[]};out.push(cur);}
    else{if(!cur){if(!ln.replace(/\s+/g,""))continue;cur={t:"",b:[]};out.push(cur);}cur.b.push(ln);}
  }
  for(i=0;i<out.length;i++){
    var paras=out[i].b.join("\n").split(/\n\s*\n/),h="",j;
    for(j=0;j<paras.length;j++){if(paras[j].replace(/\s+/g,""))h+="<p>"+esc(paras[j].replace(/^\s+|\s+$/g,"")).replace(/\n/g,"<br>")+"</p>";}
    out[i].h=h;
  }
  return out;
}
function convBook(c){var r=c.raw,u=parseCh(r.text_uk),e=parseCh(r.text_en),n=Math.max(u.length,e.length),ch=[],i;
  for(i=0;i<n;i++){ch.push({t:[u[i]?u[i].t:"",e[i]?e[i].t:""],h:[u[i]?u[i].h:"",e[i]?e[i].h:""]});}

  if(ch.length)b.ch=ch;else b.soon=true;
  if(r.link)b.links=[[L("orig"),r.link]];
  return b;}
function convSermon(c){var r=c.raw,pu=lines(r.pts_uk),pe=lines(r.pts_en),n=Math.max(pu.length,pe.length),pts=[],i;
  for(i=0;i<n;i++)pts.push([pu[i]||"",pe[i]||""]);
  var rf=String(r.refs||"").split(",").map(function(x){return x.replace(/^\s+|\s+$/g,"");}).filter(function(x){return x;});
  return {id:c.id,custom:true,title:r.orig||"",tt:[r.title_uk||"",r.title_en||""],date:r.date||"",dur:"",lang:r.lang||"",cats:r.cat?[r.cat]:[],refs:rf,refsEn:rf,sum:[r.sum_uk||"",r.sum_en||""],pts:pts,url:r.url||""};}
function convQa(c){var r=c.raw,u=lines(r.qs_uk),e=lines(r.qs_en),n=Math.max(u.length,e.length),qs=[],i,a,b;
  for(i=0;i<n;i++){a=(u[i]||"").split("|");b=(e[i]||"").split("|");

  return {id:c.id,custom:true,date:r.date||"",title:[r.title_uk||"",r.title_en||""],url:r.url||"",qs:qs};}

var PL={id:null,ctx:null,tm:null,master:null,audio:null,step:0};
function stopPlay(){if(PL.tm){clearInterval(PL.tm);PL.tm=null;}
  if(PL.master&&PL.ctx){try{PL.master.gain.setTargetAtTime(0,PL.ctx.currentTime,0.15);}catch(e){}}
  if(PL.audio){try{PL.audio.pause();}catch(e2){}PL.audio=null;}PL.id=null;}
function tone(freq,dur,vol,wave){var c=PL.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=wave;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.06);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(PL.master);o.start(t);o.stop(t+dur+0.05);}
function startGen(m){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast(L("audioErr"));return false;}
  if(!PL.ctx)PL.ctx=new AC();if(PL.ctx.state==="suspended")PL.ctx.resume();
  PL.master=PL.ctx.createGain();PL.master.gain.value=0.16;PL.master.connect(PL.ctx.destination);PL.step=0;
  var g=m.gen,pat=[0,2,4,2,5,4,2,1,3,5,7,5,4,2,3,1];
  function tick(){var s=PL.step++,idx=pat[s%pat.length],f;
    if(Math.random()<0.25)idx=Math.floor(Math.random()*g.scale.length);if(idx>=g.scale.length)idx=g.scale.length-1;
    f=g.root*Math.pow(2,g.scale[idx]/12);
    if(s%8!==7)tone(f,2.2,0.5,g.wave);
    if(s%4===0){tone(g.root/2,3.6,0.35,"sine");tone(g.root/2*Math.pow(2,7/12),3.6,0.18,"sine");}
    if(s%8===4)tone(f*2,1.6,0.12,"sine");}
  tick();PL.tm=setInterval(tick,g.beat);return true;}
function playTrack(id){var m=byId(allMusic(),id);if(!m)return;
  if(PL.id===id){stopPlay();render(true);return;}
  stopPlay();
  if(m.gen){if(startGen(m))PL.id=id;}
  else if(m.url){try{PL.audio=new Audio(m.url);PL.audio.onerror=function(){toast(L("audioErr"));stopPlay();render(true);};PL.audio.onended=function(){stopPlay();render(true);};
      var pr=PL.audio.play();if(pr&&pr.catch)pr.catch(function(){toast(L("audioErr"));stopPlay();render(true);});PL.id=id;}catch(e){toast(L("audioErr"));}}
  else toast(L("soon"));
  render(true);}

  for(i=0;i<bs.length;i++){k=bs[i].getAttribute("data-nav");bs[i].querySelector("span").textContent=L(nb[k]);bs[i].className=k===cur?"on":"";}
  el("brandA").textContent=I.brandA[LI];el("brandB").textContent=I.brandB[LI];
  el("lgUk").className=LI===0?"on":"";el("lgEn").className=LI===1?"on":"";
  el("backBtn").style.display=S.hist.length?"":"none";
  document.documentElement.lang=LI?"en":"uk";
  document.title=LI?"Eternal Life in Grace":"Вічне життя в благодаті";}
function render(keep){var sc=el("scroll"),y=sc.scrollTop,f=V[S.view]||V.home;
  el("view").innerHTML=f(S.param)+'<div class="foot">'+esc(L("disc"))+'</div>';
  bindAll(el("view"));wireInputs();fillList();chrome();
  sc.scrollTop=keep?y:0;}
function go(view,param,replace){
  if(!replace&&(view!==S.view||param!==S.param)){S.hist.push([S.view,S.param,el("scroll").scrollTop]);if(S.hist.length>40)S.hist.shift();}
  S.view=view;S.param=param;render(false);
  if(view==="read"){var a=String(param).split("|"),p=S.pos[a[0]];var cn=parseInt(a[1],10)||0;if(p&&p.ch===cn&&p.y)el("scroll").scrollTop=p.y;else{S.pos[a[0]]={ch:cn,y:0};store.set("pos",S.pos);}}}
function back(){var h=S.hist.pop();if(!h){go("home",null,true);return;}S.view=h[0];S.param=h[1];render(false);el("scroll").scrollTop=h[2]||0;}
function applyPrefs(){document.documentElement.style.setProperty("--fs",FS[S.fs]+"px");document.body.className=S.calm?"calm":"";}
function setLang(i){LI=i;store.set("lang",i?"en":"uk");render(true);}

(function init(){
  var lg=store.get("lang",null),sp=el("scroll"),tmr=null,bs,i;
  if(lg==null){lg=(navigator.language||"uk").toLowerCase().indexOf("uk")===0||(navigator.language||"").toLowerCase().indexOf("ru")===0?"uk":(/^en/i.test(navigator.language||"")?"en":"uk");}
  LI=lg==="en"?1:0;
  S.fs=store.get("fs",1);S.calm=store.get("calm",false);S.paper=store.get("paper",false);S.bm=store.get("bm",{})||{};S.prog=store.get("prog",{})||{};S.pos=store.get("pos",{})||{};S.last=store.get("last",null);
  var c=store.get("custom",null),k;if(c){for(k in S.custom)if(c[k]&&c[k].length!=null)S.custom[k]=c[k];}
  applyPrefs();
  el("lgUk").addEventListener("click",function(){setLang(0);});
  el("lgEn").addEventListener("click",function(){setLang(1);});
  el("brandBtn").addEventListener("click",function(){go("home",null);});
  el("backBtn").addEventListener("click",function(){back();});
  bs=el("bnav").querySelectorAll("button");
  for(i=0;i<bs.length;i++)(function(b){b.addEventListener("click",function(){S.hist=[];go(b.getAttribute("data-nav"),null,true);});})(bs[i]);
  sp.addEventListener("scroll",function(){if(S.view!=="read")return;if(tmr)return;tmr=setTimeout(function(){tmr=null;if(S.view!=="read")return;var a=String(S.param).split("|");S.pos[a[0]]={ch:parseInt(a[1],10)||0,y:sp.scrollTop};store.set("pos",S.pos);},400);});
  render(false);
})();

</script>
</body>
